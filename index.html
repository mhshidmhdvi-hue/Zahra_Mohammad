<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوتنامه زهرا و محمد</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Vazirmatn", Tahoma, sans-serif;
  background: linear-gradient(145deg, #f7f0eb, #eadbd2);
  color: #4b3a33;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: rgba(255,255,255,0.94);
  border-radius: 28px;
  padding: 40px 25px 30px;
  text-align: center;
  box-shadow: 0 15px 45px rgba(70,50,40,0.15);
  border: 1px solid #e3d2c8;
}

.top {
  color: #9a7868;
  font-size: 14px;
  margin-bottom: 20px;
}

.names {
  font-size: 38px;
  font-weight: 600;
  color: #735548;
  margin-bottom: 15px;
}

.heart {
  color: #a67867;
  font-size: 25px;
  margin: 0 7px;
}

.line {
  width: 70px;
  height: 1px;
  background: #c9a999;
  margin: 20px auto 25px;
}

.text {
  font-size: 16px;
  line-height: 2.2;
  margin-bottom: 25px;
}

.details {
  background: #f7f0ec;
  border-radius: 20px;
  padding: 15px;
  margin-bottom: 22px;
}

.detail {
  padding: 8px;
  font-size: 15px;
}

.label {
  color: #98796b;
  margin-left: 7px;
}

.value {
  font-weight: 600;
}

.location {
  font-size: 14px;
  line-height: 2;
  margin-bottom: 22px;
}

.location strong {
  color: #735548;
  font-size: 16px;
}

.map {
  display: inline-block;
  text-decoration: none;
  background: #806254;
  color: white;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
}

.footer {
  margin-top: 25px;
  color: #a18b80;
  font-size: 12px;
}

</style>
</head>

<body>

<div class="card">

  <div class="top">
    به رسم مهر و به شوق آغاز یک زندگی
  </div>

  <div class="names">
    زهرا <span class="heart">♥</span> محمد
  </div>

  <div class="line"></div>

  <div class="text">
    حضور گرم و صمیمی شما را<br>
    در جشن پیوندمان گرامی می‌داریم.
  </div>

  <div class="details">

    <div class="detail">
      <span class="label">تاریخ:</span>
      <span class="value">۲۸ شهریور ۱۴۰۵</span>
    </div>

    <div class="detail">
      <span class="label">ساعت:</span>
      <span class="value">۱۹ تا پاسی از شب</span>
    </div>

  </div>

  <div class="location">
    <strong>مکان مراسم</strong><br>
    جاده اصفهان ـ مبارکه<br>
    جنب کارخانه چینی زرین<br>
    عمارت وستا
  </div>

  <a
    class="map"
    href=https://balad.ir/p/2Wov14ieRwOyqh 
    target="_blank">
    📍 مسیریابی به محل مراسم
  </a>

  <div class="footer">
    حضور شما، زیبایی این شب را کامل‌تر می‌کند ✨
  </div>

</div>

</body>
</html>
